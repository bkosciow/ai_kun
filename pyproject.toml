[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_kun_kosci"
version = "0.0.2"

description = "Helps create an AI assistant with MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "fastmcp>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

